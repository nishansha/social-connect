spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  encryption:
    key: ${APP_ENCRYPTION_KEY}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:social-publisher}
  meta:
    app-id: ${META_APP_ID}
    app-secret: ${META_APP_SECRET}
    graph-api-version: ${META_GRAPH_API_VERSION:v21.0}
    oauth-redirect-base-url: ${META_OAUTH_REDIRECT_BASE_URL}
  video-gen:
    provider: ${VIDEO_GEN_PROVIDER:replicate}
    api-key: ${VIDEO_GEN_API_KEY}
    model: ${VIDEO_GEN_MODEL}

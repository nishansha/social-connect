spring:
  datasource:
    # Reuses garage-api's existing local Postgres instance — new schema ("social"), not a new DB.
    url: jdbc:postgresql://localhost:5432/garage_dev_2
    username: postgres
    password: garage123

app:
  jwt:
    secret: "dev-only-not-a-real-secret-base64-encoded-0000000000"
  encryption:
    key: "6DTFxjPhqCuT2Lho8ZAnSdtl0wG7E+s984PktlG0kjk=" # dev-only 32-byte key, base64 (openssl rand -base64 32)
  storage:
    minio:
      endpoint: http://localhost:9000
      # Only resolvable from this machine. Presigned URLs minted against this default are handed
      # to Meta's own servers (createVideoContainer's video_url) to fetch — Meta trying to resolve
      # "localhost" obviously can't reach this machine, so the fetch fails before it's ever a real
      # network request (nothing to see in ngrok's own request log, since it never arrives). Point
      # this at the same tunnel garage-api uses for its MinIO bucket (same local MinIO server,
      # just a different bucket) when testing the video-post path locally.
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:https://1b87-2409-40f3-103-bdc2-187b-bd24-984f-ef57.ngrok-free.app}
      access-key: minioadmin
      secret-key: minioadmin
      bucket: social-publisher
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    graph-api-version: v21.0
    # Must exactly match a "Valid OAuth Redirect URI" on the Meta App — this service's own public
    # URL, not garage-api's. Local testing needs a second ngrok tunnel for this port (8090),
    # re-registered on the Meta App's redirect-URI allow-list every time the tunnel URL changes.
    # Current tunnel as of 2026-10-13 (free tier — changes if ngrok restarts).
    oauth-redirect-base-url: ${META_OAUTH_REDIRECT_BASE_URL:https://c0be-2409-40f3-103-bdc2-187b-bd24-984f-ef57.ngrok-free.app}
  video-gen:
    provider: replicate
    # Read from env, never committed — export VIDEO_GEN_API_KEY before `mvn spring-boot:run`.
    api-key: ${VIDEO_GEN_API_KEY:}
    model: ${VIDEO_GEN_MODEL:}
